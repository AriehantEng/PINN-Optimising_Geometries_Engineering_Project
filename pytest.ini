[pytest]
testpaths = tests
# The repo root must be importable as `src`. pytest inserts the *test*
# directory into sys.path, not the root, so a bare `pytest` invocation fails
# with ModuleNotFoundError while `python -m pytest` (which adds the CWD)
# succeeds. This makes both work, which is what CI was tripping over.
pythonpath = .
markers =
    slow: requires training a network (minutes, not seconds)
    phase2: placeholder gate that must not pass until Phase 2 is implemented
    phase3: placeholder gate that must not pass until Phase 3 is implemented
filterwarnings =
    ignore::DeprecationWarning
