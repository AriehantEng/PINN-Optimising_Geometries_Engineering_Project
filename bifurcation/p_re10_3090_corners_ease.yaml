# Accuracy option test: option 2: residuals within 0.1, not 0.3, of a corner down-weighted.
# A warm start from the finished corner-mode run (training.init_from), the function unchanged at
# the start; 50 Levenberg-Marquardt steps on seed 22's draws, the same for all four
# options, so they differ only in the change named here. Ranked against finite
# elements, never by loss (CLAUDE.md).
name: parametric_re10_3090_corners_ease
seed: 22  # not 21: the parent's held-out points chose it
physics:
  reynolds: 10.0              # Re_h of the parent, as Network 1
  pressure_scaling: inertial
geometry:
  angle1: 30.0                # degrees from the parent's axis, daughter 1 up
  angle2: 90.0                # daughter 2 down
  parent_length: 3.0
  daughter_length: 4.0
  min_width: 0.2
design:
  split_min: 0.35             # w1 / w0, the network's input range
  split_max: 0.65
  outlet1_share: 0.5          # prescribed, at every split
inlet:
  profile: parabola
model:
  width: 40                   # inputs (x, y, s): 5,507 parameters with the offset and corner series
  depth: 4
  activation: tanh
  init_gain: 1.0
  input_scale: 2.0            # x* - centre, divided by this; s mapped onto [-1, 1]
  distance_order: 1
  wall_extension: 0.5
  blend_exponent: 2.0
  offset_degree: 4            # outlet 1's extra pressure, Chebyshev in s, degree 4
  corner_modes: stokes        # psi += c(s) chi(r) r^(1+z) f(theta) at B, C and T
  corner_degree: 4            # c(s): Chebyshev in s, as the offset
  corner_cutoff: 0.5          # chi's radius; 0.2 short of the nearest other edge
  corner_exponent_max: 1.0    # the modes with Re z < 1: the four above
sampling:
  designs: 16                 # splits per draw, stratified over the range
  points_per_design: 1024     # 16,384 interior points per draw (the fixed run: 8,192)
  density: uniform            # interior points uniform in area; width: the same number across every channel
  corner_fraction: 0.1
  corner_radius: 0.5
  corner_exclusion: 0.02
  inlet_per_design: 32
  outlet_per_design: 32       # per outlet
  validation_designs: 32      # held-out: 32 splits x 1,024 points
  n_flux: 64
weights:
  momentum_x: 1.0
  momentum_y: 1.0
  inlet: 1.0
  outlet: 1.0
  corner_radius: 0.1            # was 0.3
training:
  adam:
    steps: 0                  # continuing: Levenberg-Marquardt only
    learning_rate: 1.0e-3
    decay_rate: 0.9
    decay_steps: 1000
    resample_every: 250
  lbfgs:
    cycles: 0
    iterations_per_cycle: 500
    gtol: 1.0e-14
  lm:
    iterations: 50             # the same budget for every option
    damping: 1.0e-4
    resample_every: 1
    average: 20
  check_every: 250
  init_from: parametric_re10_3090_equal_corners  # the finished corner-mode run
evaluation:
  max_area: 0.002             # the reference's mesh, as the fixed run
  corner_levels: 6
  corner_radius: 0.4
  n_line: 256
  splits: [0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65]
  search_xatol: 0.002         # Brent's tolerance on both optima
  curve_points: 61            # the PINN's drop curve over the range
  continuation: []          # the reference by one Newton solve from Stokes
