# Network 2, first run: one fixed bifurcation, scored against the finite-
# element solution of the same problem (bifurcation/reference.py).
#
# 30/90: a 120-degree bifurcation turned off-centre, widths 1 and 1, each
# daughter required to carry half the flow. Asymmetric on purpose: the
# reference needs outlet 1 to sit 0.54 above outlet 2 to deliver equal shares
# (coarse mesh, daughter_length 8), so the trained offset's sign and size are
# checked, which a mirror-symmetric case (offset 0) could not do.
#
# Daughters 4 long rather than 8: the flow is developed within ~1 at Re 10,
# so 4 keeps the developed part while halving the area to resolve.
name: bifurcation_re10_3090_equal
seed: 11
physics:
  reynolds: 10.0              # Re_h of the parent, as Network 1
  pressure_scaling: inertial
geometry:
  split: 0.5                  # w1 / w0
  angle1: 30.0                # degrees from the parent's axis, daughter 1 up
  angle2: 90.0                # daughter 2 down
  parent_length: 3.0
  daughter_length: 4.0
  min_width: 0.2
outlets:
  split: prescribed           # or free: equal outlet pressures
  outlet1_share: 0.5
inlet:
  profile: parabola           # the developed inflow; network1 couples Network 1
model:
  width: 40                   # 5,404 parameters with the outlet offset
  depth: 4
  activation: tanh
  init_gain: 1.0
  input_scale: 2.0            # x* - centre of the bounding box, divided by this
  distance_order: 1           # R-equivalence order of the wall distance
  formulation: "velocity_pressure"
sampling:
  n_interior: 8192
  corner_fraction: 0.1        # extra points, uniform in area, near the singular corners
  corner_radius: 0.5
  corner_exclusion: 0.05      # no point closer to B, T, C: the residual grows like 1/r there
  n_inlet: 256
  n_outlet: 256               # per outlet
  n_validation: 32768
  n_flux: 64                  # Gauss-Legendre points for Q1 and Q_in
weights:
  momentum_x: 1.0
  momentum_y: 1.0
  continuity: 1.0
  inlet: 1.0
  outlet: 1.0
  corner_radius: 0.0
  flux: 1.0
training:
  adam:
    steps: 3000
    learning_rate: 1.0e-3
    decay_rate: 0.9
    decay_steps: 1000
    resample_every: 250
  lbfgs:
    cycles: 4
    iterations_per_cycle: 500
    gtol: 1.0e-14
  lm:
    iterations: 150
    damping: 1.0e-4
    resample_every: 1         # fresh points every step, as Network 1's polish
    average: 20
  check_every: 250
evaluation:
  max_area: 0.002             # the reference's mesh
  corner_levels: 6
  corner_radius: 0.4
  n_line: 256                 # Gauss-Legendre points on each opening
