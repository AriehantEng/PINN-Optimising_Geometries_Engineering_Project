# Network 3: the best width split, and the lowest pressure drop, from the
# daughters' angles and a set flow share. Trained on the finite-element
# design study's 66 optima (docs/bifurcation_re10-shares.json: 60/60, 30/90,
# 0/120, 90/90, 60/120, 30/150 x shares 0.05-0.95), as corrections to the
# friction law, which already gets the split to within 0.023.
name: network3_re10_shares
seed: 7
data: docs/bifurcation_re10-shares.json
model:
  width: 8                    # 186 parameters: small, for 66 optima
  depth: 2
  activation: tanh
  init_gain: 1.0
fit:
  split_scale: 0.001          # a split error of 0.001 weighs like a 0.1% drop error
  drop_scale: 0.001
  regularisation: [0.0, 0.01, 0.1, 1.0, 10.0, 100.0]   # weight decay candidates, chosen by
                                                        # leaving one angle pair out
  restarts: 3                 # least-squares fits from 3 initialisations; the best is kept
  max_evaluations: 2000
  workers: 1
validation:                   # angle pairs it never saw, checked by finite elements
  pairs: [[45.0, 75.0], [15.0, 105.0], [75.0, 105.0], [45.0, 135.0], [30.0, 30.0], [0.0, 90.0]]
  shares: [0.2, 0.5, 0.8]
  workers: 2
