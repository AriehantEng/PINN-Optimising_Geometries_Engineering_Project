# Case A (fully developed), Re = 50, inertial pressure scaling.
# SPEC section 2: accuracy vs Re is a reportable result; degradation
# with increasing Re is expected, not a bug.
name: caseA_re50
seed: 0
case: A
domain:
  length: 20.0
physics:
  reynolds: 50.0
  pressure_scaling: inertial
  formulation: velocity_pressure
model:
  arch: modified_mlp
  width: 128
  depth: 4
  fourier:
    enabled: false
  rwf:
    enabled: false
bc:
  inlet: soft
  outlet_velocity: soft
  pressure_gauge: hard
sampling:
  n_interior: 2048
  n_inlet: 128
  n_outlet: 128
  resample_every: 500
  seed: 1
weights:
  scheme: fixed
  values:
    momentum_x: 1.0
    momentum_y: 1.0
    continuity: 1.0
    inlet: 1.0
    outlet_velocity: 1.0
training:
  adam:
    steps: 2000
    lr_init: 0.001
    decay_rate: 0.9
    decay_steps: 1000
  lbfgs:
    enabled: true
    max_iterations: 6000
    gtol: 1.0e-14
evaluation:
  nx: 401
  ny: 201
