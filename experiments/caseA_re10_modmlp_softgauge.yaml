# Case A, Re = 10, modified MLP with the SOFT pressure gauge.
#
# This is the honest counterpart to caseA_re10_target.yaml. Under the hard
# gauge the Case A solution collapses to three constants, so the ansatz does
# the work; here N_p must actually represent a field that is affine in x, and
# the network has to do it. The sweep reached 6.96e-6 relative L2 on u this way
# at a reduced budget (Adam 1500 + L-BFGS 3000, width 64), against the SPEC
# target of 1e-5 -- so the target is met without leaning on the gauge.
#
# Both configurations are run and both are reported. See
# docs/phase1-findings.md.
name: caseA_re10_modmlp_softgauge
seed: 0
case: A

domain:
  length: 20.0

physics:
  reynolds: 10.0
  pressure_scaling: inertial
  formulation: velocity_pressure

model:
  arch: modified_mlp      # SPEC section 3 item 3, two-encoder multiplicative mixing
  width: 128
  depth: 4
  fourier:
    enabled: false        # measured harmful here: 8.46e-5 vs 3.48e-5 baseline
  rwf:
    enabled: false

bc:
  inlet: soft
  outlet_velocity: soft
  pressure_gauge: soft

sampling:
  n_interior: 2048
  n_inlet: 128
  n_outlet: 128
  resample_every: 500
  seed: 1

weights:
  scheme: fixed           # grad_norm measured harmful: see docs/phase1-findings.md
  values:
    momentum_x: 1.0
    momentum_y: 1.0
    continuity: 1.0
    inlet: 1.0
    outlet_velocity: 1.0
    pressure_gauge: 1.0

training:
  adam:
    steps: 3000
    lr_init: 1.0e-3
    decay_rate: 0.9
    decay_steps: 1000
  lbfgs:
    enabled: true
    max_iterations: 20000
    gtol: 1.0e-14

evaluation:
  nx: 401
  ny: 201
