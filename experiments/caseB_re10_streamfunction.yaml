# Case B (developing entrance flow), Re = 10, STREAM-FUNCTION formulation.
#
# Direct test of the SPEC section 3 comparison, motivated by a measured
# failure: the velocity-pressure run of this same case gained 6% mass down the
# channel (flux 2.004 at the first station, 2.132 at the last) because
# continuity there is only a soft penalty. That drift also corrupted the
# entrance-length measurement, which is taken at 99% of the developed
# centreline.
#
# With u = dpsi/dy, v = -dpsi/dx continuity holds identically, and the psi_base
# construction fixes the flux exactly, so mass cannot drift at all.
#
# NOTE for the write-up: this makes SPEC test 3 (mass conservation) trivially
# true by construction for this formulation, so it stops being an independent
# check here. It remains a real check for velocity-pressure. See
# docs/spec-deviations.md item 6.
#
# Uses the SINE base flow. The cubic base is the exact fully developed profile
# and would hand the answer to the network.
name: caseB_re10_streamfunction
seed: 0
case: B
domain:
  length: 20.0
physics:
  reynolds: 10.0
  pressure_scaling: inertial
  formulation: stream_function
  inlet_uniform_value: 1.0
model:
  arch: modified_mlp
  width: 128
  depth: 4
  fourier:
    enabled: false
  rwf:
    enabled: false
  stream_base: sine
bc:
  inlet: soft
  outlet_velocity: soft
  pressure_gauge: hard
sampling:
  n_interior: 2048
  n_inlet: 128
  n_outlet: 128
  resample_every: 500
  seed: 1
weights:
  scheme: fixed
  values:
    momentum_x: 1.0
    momentum_y: 1.0
    inlet: 1.0
    outlet_velocity: 1.0
training:
  adam:
    steps: 2000
    lr_init: 0.001
    decay_rate: 0.9
    decay_steps: 1000
  lbfgs:
    enabled: true
    max_iterations: 6000
    gtol: 1.0e-14
evaluation:
  nx: 401
  ny: 201
