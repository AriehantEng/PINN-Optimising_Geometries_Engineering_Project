# Case A, Re = 10, selected configuration, with a 4x larger L-BFGS budget.
#
# Sole purpose: settle whether SPEC test 3 (mass conservation, 1e-6) fails at
# the standard budget because the optimiser ran out of iterations or because
# something is structurally wrong. At 6000 iterations the run reached 2.227e-6
# -- a factor 2.2 short -- and L-BFGS terminated on its iteration cap with the
# loss still descending, so more budget is the one legitimate remedy. The
# tolerance is not touched.
#
# Identical to caseA_re10_target.yaml in every other key, so the comparison is
# attributable to the budget alone.
name: caseA_re10_target_long
seed: 0
case: A
domain:
  length: 20.0
physics:
  reynolds: 10.0
  pressure_scaling: inertial
  formulation: velocity_pressure
model:
  arch: modified_mlp
  width: 128
  depth: 4
  fourier:
    enabled: false
  rwf:
    enabled: false
bc:
  inlet: soft
  outlet_velocity: soft
  pressure_gauge: hard
sampling:
  n_interior: 2048
  n_inlet: 128
  n_outlet: 128
  resample_every: 500
  seed: 1
weights:
  scheme: fixed
  values:
    momentum_x: 1.0
    momentum_y: 1.0
    continuity: 1.0
    inlet: 1.0
    outlet_velocity: 1.0
training:
  adam:
    steps: 2000
    lr_init: 0.001
    decay_rate: 0.9
    decay_steps: 1000
  lbfgs:
    enabled: true
    max_iterations: 24000
    gtol: 1.0e-14
evaluation:
  nx: 401
  ny: 201
