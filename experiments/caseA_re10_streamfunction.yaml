# Case A, Re = 10, stream-function formulation (SPEC section 3).
# Uses the SINE base flow, not the cubic one: the cubic base IS the exact
# Case A solution, so a comparison using it would measure the ansatz
# rather than the method. See docs/spec-deviations.md item 6.
name: caseA_re10_streamfunction
seed: 0
case: A
domain:
  length: 20.0
physics:
  reynolds: 10.0
  pressure_scaling: inertial
  formulation: stream_function
model:
  arch: modified_mlp
  width: 128
  depth: 4
  fourier:
    enabled: false
  rwf:
    enabled: false
  stream_base: sine
bc:
  inlet: soft
  outlet_velocity: soft
  pressure_gauge: hard
sampling:
  n_interior: 2048
  n_inlet: 128
  n_outlet: 128
  resample_every: 500
  seed: 1
weights:
  scheme: fixed
  values:
    momentum_x: 1.0
    momentum_y: 1.0
    inlet: 1.0
    outlet_velocity: 1.0
training:
  adam:
    steps: 2000
    lr_init: 0.001
    decay_rate: 0.9
    decay_steps: 1000
  lbfgs:
    enabled: true
    max_iterations: 6000
    gtol: 1.0e-14
evaluation:
  nx: 401
  ny: 201
