# Case A (fully developed channel), Re = 10 — the SPEC test 1 gate config.
#
# Selected by the Case A sweep. At a reduced budget (Adam 1500 + L-BFGS 3000,
# width 64) this formulation reached 4.32e-6 relative L2 on u and 4.53e-6 on
# max|v*|, against SPEC targets of 1e-5 for both. The budget below is larger.
#
# The decisive setting is bc.pressure_gauge: hard. Substituting the exact
# solution into the x-momentum residual leaves R_x = p_x + 2/Re, so the
# residual demands an exactly linear pressure field, which tanh cannot produce.
# Under p = (1 - x*/L*) N_p the required N_p is the CONSTANT 2L*/Re, which is
# exactly representable, and the error on u drops 8x (3.48e-5 -> 4.32e-6).
#
# CAVEAT, and it must travel with any quoted number: under the hard gauge the
# whole Case A solution collapses to three constants (N_u = 1, N_v = 0,
# N_p = 2L*/Re), so this is an unusually easy optimisation problem. The
# soft-gauge run is kept as experiments/caseA_re10_baseline.yaml and reported
# alongside. Case B is unaffected by this and remains the case that actually
# predicts Phase 2. See docs/phase1-findings.md section 4.
name: caseA_re10_target
seed: 0
case: A

domain:
  length: 20.0

physics:
  reynolds: 10.0
  pressure_scaling: inertial
  formulation: velocity_pressure

model:
  arch: modified_mlp      # sweep: 6.96e-6 vs 3.48e-5 for the plain MLP
  width: 128              # SPEC section 3: published recommendation 128-512
  depth: 4                # published recommendation 3-6
  fourier:
    enabled: false        # measured harmful here: 8.46e-5 vs 3.48e-5 baseline
  rwf:
    enabled: false

bc:
  inlet: soft
  outlet_velocity: soft
  pressure_gauge: hard    # see the header: the decisive setting

sampling:
  n_interior: 2048
  n_inlet: 128
  n_outlet: 128
  resample_every: 500
  seed: 1

weights:
  scheme: fixed           # grad_norm measured harmful: see docs/phase1-findings.md
  values:
    momentum_x: 1.0
    momentum_y: 1.0
    continuity: 1.0
    inlet: 1.0
    outlet_velocity: 1.0

training:
  adam:
    steps: 3000
    lr_init: 1.0e-3
    decay_rate: 0.9
    decay_steps: 1000
  lbfgs:
    enabled: true
    max_iterations: 20000
    gtol: 1.0e-14

evaluation:
  nx: 401
  ny: 201
